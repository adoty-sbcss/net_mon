name: Build & publish collector image

# REL-3 Phase 1: build the collector image once in CI and publish it to GHCR, so
# field boxes can `docker pull` a finished image instead of building the
# Dockerfile locally (which broke behind school egress filtering — see the Ookla
# removal). This phase has ZERO box impact: boxes keep building locally until the
# Phase-2 docker-compose/auto-update cutover. It just starts publishing images.
#
# Image: ghcr.io/adoty-sbcss/netmon-collector
#   :canary       — every push to main (bleeding edge; the 'canary' channel)
#   :stable       — also every main push for now (the 'stable' channel currently
#                   tracks origin/main; a gated promotion can replace this later)
#   :<git-sha>    — immutable per-commit tag (what a pinned 'stable' ref maps to)
#
# ONE-TIME after the first successful run: make the GHCR package PUBLIC
# (github.com → your packages → netmon-collector → Package settings → Change
# visibility → Public) so field boxes pull with no credentials.

on:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/build-collector.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/adoty-sbcss/netmon-collector

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/amd64 — field boxes are all x86-64)
        uses: docker/build-push-action@v7
        with:
          context: ./collector
          file: ./collector/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:canary
            ${{ env.IMAGE }}:stable
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "Pushed:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:canary\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:stable\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If this is the first run, make the package PUBLIC in GHCR package settings." >> "$GITHUB_STEP_SUMMARY"
