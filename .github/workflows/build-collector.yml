name: Build & publish collector image

# Build the collector once after the main-branch CI workflow passes and publish
# it to GHCR, so field boxes can pull a finished immutable image instead of
# building the Dockerfile locally behind school egress filtering.
#
# Image: ghcr.io/adoty-sbcss/netmon-collector
#   :canary/:stable — compatibility aliases for the latest CI-passing main image
#   :<git-sha>      — immutable tag used by every sensor update channel
#
# ONE-TIME after the first successful run: make the GHCR package PUBLIC
# (github.com → your packages → netmon-collector → Package settings → Change
# visibility → Public) so field boxes pull with no credentials.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/adoty-sbcss/netmon-collector
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/amd64 — field boxes are all x86-64)
        uses: docker/build-push-action@v7
        with:
          context: ./collector
          file: ./collector/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:canary
            ${{ env.IMAGE }}:stable
            ${{ env.IMAGE }}:${{ env.COMMIT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "Pushed:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:canary\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:stable\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:${COMMIT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If this is the first run, make the package PUBLIC in GHCR package settings." >> "$GITHUB_STEP_SUMMARY"
