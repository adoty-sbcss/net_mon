name: Build & publish collector image

# Build the collector once after the main-branch CI workflow passes and publish
# it to GHCR, so field boxes can pull a finished immutable image instead of
# building the Dockerfile locally behind school egress filtering.
#
# Image: ghcr.io/adoty-sbcss/netmon-collector
#   :canary/:stable — compatibility aliases for the latest CI-passing main image
#   :<git-sha>      — immutable tag used by every sensor update channel
#
# ONE-TIME after the first successful run: make the GHCR package PUBLIC
# (github.com → your packages → netmon-collector → Package settings → Change
# visibility → Public) so field boxes pull with no credentials.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/adoty-sbcss/netmon-collector
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    # Publish only what landed on THIS repository's main. A workflow_run fires for
    # every completed CI run, and its `branches: [main]` filter matches the HEAD
    # branch NAME, so a pull request from a fork whose branch is called `main`
    # would pass it. CI runs on pull_request too, so without the event and
    # head-repository checks a fork's code could be built with this job's
    # packages:write token and pushed as :stable, which every fresh install pulls.
    # A manual dispatch publishes main only, for the same reason.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/amd64 — field boxes are all x86-64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./collector
          file: ./collector/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:canary
            ${{ env.IMAGE }}:stable
            ${{ env.IMAGE }}:${{ env.COMMIT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "Pushed:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:canary\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:stable\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:${COMMIT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If this is the first run, make the package PUBLIC in GHCR package settings." >> "$GITHUB_STEP_SUMMARY"
