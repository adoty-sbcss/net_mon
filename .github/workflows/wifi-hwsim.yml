# WIFI-1: join simulated Wi-Fi networks on a systemd-networkd runner (no fleet box is
# a networkd box we may freely associate). Runs when the join or battery code changes.
name: Wi-Fi join (simulated radios)

on:
  pull_request:
    paths:
      - lib/wifi.sh
      - scripts/netmon-wifi-experience.sh
      - .github/scripts/wifi-hwsim.sh
      - .github/workflows/wifi-hwsim.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hwsim:
    name: networkd join + battery (mac80211_hwsim)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install radio simulator + AP tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hostapd dnsmasq-base wpasupplicant iw
          # mac80211_hwsim ships in the base modules on some runner kernels and in
          # linux-modules-extra on others; the extra package lags new kernels.
          if ! modinfo mac80211_hwsim >/dev/null 2>&1; then
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" \
              || { uname -r; apt-cache search mac80211 | head; apt-cache search "linux-modules-extra-.*azure" | tail -5; exit 1; }
          fi
          modinfo -F filename mac80211_hwsim
      - name: Join open / PSK / PEAP and run the battery (wired host inside the Wi-Fi subnet)
        run: sudo bash .github/scripts/wifi-hwsim.sh
