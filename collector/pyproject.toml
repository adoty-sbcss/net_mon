[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appmon-collector"
version = "0.1.0"
description = "App_Mon network discovery collector"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "manuf>=1.1",
    "pysnmp>=5.0",
    "paramiko>=3.4",
]

[project.scripts]
appmon = "collector.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]
