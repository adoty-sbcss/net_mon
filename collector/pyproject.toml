[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netmon-collector"
version = "0.1.0"
description = "NetMon network discovery collector"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "manuf>=1.1",
    "paramiko>=3.4",
    # Synchronous WS client for the remote-console (browser-SSH) session: the
    # sensor dials OUT to the tunnel broker over WSS and services diagnostics.
    "websocket-client>=1.7",
    # WinRM client for authoritative DHCP server intelligence (DHCP-2): drives the
    # Windows DhcpServer PowerShell module remotely. The [kerberos] extra adds
    # Kerberos auth (DHCP-8) for AD servers with NTLM disabled — compiled against
    # libkrb5 in the image; the NTLM path still needs no krb5. Imported only when a
    # DHCP target is actually collected (feature off by default).
    "pywinrm[kerberos]>=0.4",
]
# Note: SNMP is handled by shelling out to the net-snmp CLI (snmpget /
# snmpbulkwalk, installed via the `snmp` apt package in the Dockerfile),
# not a Python library. pysnmp was removed because its 7.x release dropped
# the synchronous hlapi API the collector relied on.

[project.optional-dependencies]
# Tools the CI guard installs. `pip install -e .[dev]` gets you the same
# checks locally that CI runs.
dev = [
    "mypy>=1.8",
    "ruff>=0.4",
    "pytest>=8",
]

[project.scripts]
netmon = "collector.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
# The collector only ever runs on Linux (Docker on Ubuntu). Pin the platform so
# Linux-only stdlib (os.statvfs / getloadavg / uname) type-checks the same on a
# Windows dev box as it does in Linux CI.
platform = "linux"
# Third-party libs (psycopg, structlog, paramiko, manuf, ...) ship without
# type stubs; don't fail on their missing imports.
ignore_missing_imports = true
# THE important one: check the bodies of functions even when they lack type
# annotations. Without this, mypy skips most of our code and would NOT have
# caught the settings.mode / run_scan(is_primary=...) crash. With it, those
# show up as attr-defined / call-arg errors.
check_untyped_defs = true
# Keep the signal high: we care about real call/attribute bugs, not a
# campaign to fully annotate the codebase.
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes (undefined names, unused imports),
# B = bugbear (likely bugs), I = import sorting, UP = pyupgrade.
select = ["E", "F", "B", "I", "UP"]
# Don't sweat line length — we have some long log lines and SQL strings.
ignore = ["E501"]
