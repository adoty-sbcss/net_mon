# Config and state live OUTSIDE the repo, under /etc/netmon and /var/lib/netmon,
# so a re-clone of this repo never disturbs them. The env file is created by
# setup.sh (or the first-boot wizard) and contains all NETMON_* and POSTGRES_*
# settings. Migration from the old in-repo layout happens automatically on
# the next ./setup.sh or auto-update run; see lib/paths.sh.

services:
  postgres:
    image: postgres:16-alpine
    container_name: netmon-postgres
    restart: unless-stopped
    env_file:
      - /etc/netmon/netmon.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmon}
      POSTGRES_DB: ${POSTGRES_DB:-netmon}
    ports:
      # Bind to loopback only — the collector reaches it via host networking.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netmon} -d ${POSTGRES_DB:-netmon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  collector:
    # REL-3: pull a prebuilt image from GHCR (published by CI), selected by
    # NETMON_IMAGE_TAG (auto-update writes it to .env: stable | canary | <sha>).
    # `build:` is KEPT as a fallback — if a box can't reach ghcr.io (egress
    # filtering), auto-update.sh builds locally instead (reliable again now that
    # the Ookla install was removed from the Dockerfile). Default tag = stable.
    image: ghcr.io/adoty-sbcss/netmon-collector:${NETMON_IMAGE_TAG:-stable}
    build: ./collector
    container_name: netmon-collector
    restart: unless-stopped
    # Host networking so we can see real interfaces, LLDP frames, broadcast traffic.
    network_mode: host
    # We need raw sockets, packet capture, and the ability to send ARP probes.
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    # Privileged is the simplest path on Ubuntu; if you'd rather, drop privileged
    # and rely on the cap_add list above plus AppArmor=unconfined.
    privileged: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - /etc/netmon/netmon.env
    environment:
      # Wiring + defaults if the env file doesn't set them. Everything operator-
      # configurable belongs in /etc/netmon/netmon.env, not here.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-netmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmon}
      POSTGRES_DB: ${POSTGRES_DB:-netmon}
      NETMON_SNMP_CONFIG: /etc/netmon/snmp.yaml
      NETMON_BUNDLE_DIR: /var/lib/netmon/bundles
    # Cap Docker's own log buffer so it can't fill the disk if the collector
    # gets chatty. Persistent history is in /var/log/netmon (mounted below).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      # Full state dir (not just bundles/) so the enrollment token, applied-
      # config version, and iperf last-run survive a container rebuild —
      # otherwise every recreate wipes the token and forces re-enrollment.
      - /var/lib/netmon:/var/lib/netmon
      # MUST be read-write: the dashboard control-plane check-in rewrites
      # netmon.env in place to apply pushed config (SNMP targets/communities,
      # SFTP, iperf). A read-only mount makes every check-in crash with
      # "Read-only file system" and silently disables config push.
      - /etc/netmon:/etc/netmon
      # Persistent rotated logs on the host. See logging_setup.py.
      - /var/log/netmon:/var/log/netmon
      # Schema migrations applied by the collector on startup. Mounted (not
      # baked into the image) so an auto-update can ship new migration files
      # via `git pull` without requiring an image rebuild.
      - ./db/migrations:/app/migrations:ro
      # Match the container's clock and zone to the host so hourly uploads fire
      # at local-time minute 0 and filenames use the box's wall clock.
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Host's DNS config for the DNS health probes. Both files are mounted
      # read-only; the collector reads them at scan time to discover which
      # resolvers the host is using (DHCP-assigned or static). On Ubuntu the
      # systemd-resolved variant lists the real upstreams; /etc/resolv.conf
      # often just points at 127.0.0.53 (the stub).
      - /etc/resolv.conf:/etc/host-resolv.conf:ro
      - /run/systemd/resolve/resolv.conf:/etc/host-systemd-resolv.conf:ro
      # Host's OS release so the self-health check-in reports the box's real
      # distro (e.g. Ubuntu 24.04), not the collector image's base (Debian).
      # See host_metrics.py. Read-only; absent on a not-yet-recreated box, in
      # which case host_metrics falls back to the container's /etc/os-release.
      - /etc/os-release:/etc/host-os-release:ro
    command: ["run"]

volumes:
  postgres-data:
