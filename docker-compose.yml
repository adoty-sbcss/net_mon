# Config and state live OUTSIDE the repo, under /etc/netmon and /var/lib/netmon,
# so a re-clone of this repo never disturbs them. The env file is created by
# setup.sh (or the first-boot wizard) and contains all NETMON_* and POSTGRES_*
# settings. Migration from the old in-repo layout happens automatically on
# the next ./setup.sh or auto-update run; see lib/paths.sh.

services:
  postgres:
    image: postgres:16-alpine
    container_name: netmon-postgres
    restart: unless-stopped
    env_file:
      - /etc/netmon/netmon.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmon}
      POSTGRES_DB: ${POSTGRES_DB:-netmon}
    ports:
      # Bind to loopback only — the collector reaches it via host networking.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netmon} -d ${POSTGRES_DB:-netmon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  collector:
    build: ./collector
    image: netmon/collector:latest
    container_name: netmon-collector
    restart: unless-stopped
    # Host networking so we can see real interfaces, LLDP frames, broadcast traffic.
    network_mode: host
    # We need raw sockets, packet capture, and the ability to send ARP probes.
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    # Privileged is the simplest path on Ubuntu; if you'd rather, drop privileged
    # and rely on the cap_add list above plus AppArmor=unconfined.
    privileged: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - /etc/netmon/netmon.env
    environment:
      # Wiring + defaults if the env file doesn't set them. Everything operator-
      # configurable belongs in /etc/netmon/netmon.env, not here.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-netmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmon}
      POSTGRES_DB: ${POSTGRES_DB:-netmon}
      NETMON_SNMP_CONFIG: /etc/netmon/snmp.yaml
      NETMON_BUNDLE_DIR: /var/lib/netmon/bundles
    # Cap Docker's own log buffer so it can't fill the disk if the collector
    # gets chatty. Persistent history is in /var/log/netmon (mounted below).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - /var/lib/netmon/bundles:/var/lib/netmon/bundles
      - /etc/netmon:/etc/netmon:ro
      # Persistent rotated logs on the host. See logging_setup.py.
      - /var/log/netmon:/var/log/netmon
      # Schema migrations applied by the collector on startup. Mounted (not
      # baked into the image) so an auto-update can ship new migration files
      # via `git pull` without requiring an image rebuild.
      - ./db/migrations:/app/migrations:ro
      # Match the container's clock and zone to the host so hourly uploads fire
      # at local-time minute 0 and filenames use the box's wall clock.
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command: ["run"]

volumes:
  postgres-data:
